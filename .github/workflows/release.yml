name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release + Homebrew tap after notarizing"
        type: boolean
        default: false
      version:
        description: "Version for workflow_dispatch dry runs (e.g. 1.0.2-rc1). Ignored on tag pushes."
        type: string
        default: "0.0.0-notarize-dry-run"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${DISPATCH_VERSION}"
            TAG="manual-${VERSION}"
            PUBLISH="${{ inputs.publish }}"
            # releases/latest/download/appcast.xml is the feed every installed
            # copy reads. A manual run must land as a prerelease so it can never
            # become "latest" and offer a test build to all users.
            PRERELEASE=true
          else
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              v*) VERSION="${TAG#v}" ;;
              *) echo "Tag must start with v" >&2; exit 1 ;;
            esac
            # A tag push publishes a non-prerelease, which GitHub makes
            # `latest`, which is the appcast feed every installed copy reads.
            # The glob above cannot express "three numeric components", so the
            # shape is enforced here.
            ./scripts/validate-release-version.sh "$VERSION"
            PUBLISH=true
            PRERELEASE=false
          fi
          case "$VERSION" in
            "") echo "Version must be non-empty" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Require a changelog for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Both the release notes and the Sparkle appcast are generated from this
          # file. Checking it here fails in seconds instead of after notarization.
          if [ ! -s "docs/changelog/${VERSION}.md" ]; then
            echo "Missing or empty docs/changelog/${VERSION}.md" >&2
            echo "Write the changelog first; the release notes and the appcast both come from it." >&2
            exit 1
          fi

      - name: Test
        run: |
          # A tag is not a branch, so ci.yml never runs on this ref. Without
          # this step a tag on a commit whose CI failed still ships a signed,
          # notarized, published release.
          swift test
          ./scripts/test-validate-release-version.sh
          ./scripts/test-generate-appcast.sh
          ./scripts/test-package-dmg-fallback.sh
          ./scripts/test-build-signing-mode.sh

      - name: Require signing secrets
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for v in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD \
                   APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8 \
                   SPARKLE_ED_PRIVATE_KEY; do
            eval "val=\${$v}"
            if [ -z "$val" ]; then
              echo "Missing secret: $v" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        id: cert
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          IDENTITY="$(./scripts/import-signing-certificate.sh | tail -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "empty signing identity from import-signing-certificate.sh" >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CODESIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          WINMICE_REQUIRE_DEVELOPER_ID: "1"
        run: ./scripts/build-app.sh --version "$VERSION"

      - name: Verify bundle metadata
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/verify-bundle-metadata.sh dist/WinMice.app "$VERSION"

      - name: Verify Sparkle embedding
        run: ./scripts/verify-sparkle-embedding.sh dist/WinMice.app

      - name: Notarize app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize-file.sh dist/WinMice.app

      - name: Verify notarized app
        run: ./scripts/verify-notarized-app.sh dist/WinMice.app

      - name: Package zip
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./scripts/package-release.sh "$VERSION"
          echo "zip=dist/WinMice-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify packaged zip
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: ./scripts/verify-packaged-zip.sh "$ZIP"

      - name: Install create-dmg
        run: |
          # Homebrew has no versioned create-dmg formula; log the resolved version for reproducibility.
          brew install create-dmg
          command -v create-dmg
          create-dmg --version

      - name: Package DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/package-dmg.sh "$VERSION"

      - name: Sign DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CODESIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          [ -n "$CODESIGN_IDENTITY" ] || { echo "CODESIGN_IDENTITY is empty; refusing to sign release DMG" >&2; exit 1; }
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "dist/WinMice-${VERSION}.dmg"

      - name: Notarize DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize-file.sh "dist/WinMice-${VERSION}.dmg"

      - name: Verify notarized DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/verify-notarized-dmg.sh "dist/WinMice-${VERSION}.dmg"

      # Stapling rewrites the DMG in place, so the checksum below must run
      # after signing/notarizing/stapling — it is the sha256 the cask pins.
      - name: Checksum
        id: sum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ZIP="dist/WinMice-${VERSION}.zip"
          DMG="dist/WinMice-${VERSION}.dmg"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Generate appcast
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          ZIP: ${{ steps.sum.outputs.zip }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          KEY_FILE="${RUNNER_TEMP}/sparkle-ed-private-key"
          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          SPARKLE_ED_KEY_FILE="$KEY_FILE" \
            ./scripts/generate-appcast.sh "$VERSION" "$ZIP" "docs/changelog/${VERSION}.md" "$TAG"
          rm -f "$KEY_FILE"

      - name: Upload workflow artifacts (dry run / debugging)
        if: steps.ver.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WinMice-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.sum.outputs.zip }}
            ${{ steps.sum.outputs.dmg }}
            dist/appcast.xml
          if-no-files-found: error

      - name: Render release notes
        if: steps.ver.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/render-release-notes.sh "$VERSION" > /tmp/release-notes.md

      - name: Publish GitHub Release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP: ${{ steps.sum.outputs.zip }}
          DMG: ${{ steps.sum.outputs.dmg }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$DMG" dist/appcast.xml --clobber
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" "$ZIP" "$DMG" dist/appcast.xml \
              --title "WinMice $VERSION" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" "$ZIP" "$DMG" dist/appcast.xml \
              --title "WinMice $VERSION" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Update Homebrew tap
        id: tap
        # Skipped for manual runs: the cask URL is built from v<version>, which
        # does not exist under a manual-<version> tag, so bumping it would point
        # every Homebrew user at a 404.
        if: steps.ver.outputs.publish == 'true' && steps.ver.outputs.prerelease != 'true'
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set" >&2
            exit 1
          fi
          TAP_DIR="${RUNNER_TEMP}/homebrew-winmice"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/anibalribeiro/homebrew-winmice.git" "$TAP_DIR"
          ./scripts/update-homebrew-cask.sh \
            "$TAP_DIR/Casks/winmice.rb" \
            "$VERSION" \
            "$SHA256"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/winmice.rb
          git diff --cached --quiet || git commit -m "winmice $VERSION"
          git push

      - name: Fail job if tap update failed
        if: steps.ver.outputs.publish == 'true' && steps.tap.outcome == 'failure'
        run: |
          echo "GitHub Release was published, but Homebrew tap update failed." >&2
          echo "Check HOMEBREW_TAP_TOKEN and the homebrew-winmice repo." >&2
          exit 1

      - name: Cleanup signing keychain
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/winmice-keychain-path" ]; then
            KEYCHAIN="$(cat "${RUNNER_TEMP}/winmice-keychain-path")"
            security delete-keychain "$KEYCHAIN" || true
            rm -f "${RUNNER_TEMP}/winmice-keychain-path" \
              "${RUNNER_TEMP}/winmice-signing.p12" \
              "${RUNNER_TEMP}/sparkle-ed-private-key" \
              "${RUNNER_TEMP}"/AuthKey_*.p8 \
              "${RUNNER_TEMP}"/*.notarize.zip \
              "${RUNNER_TEMP}"/*.notary.json || true
          fi
