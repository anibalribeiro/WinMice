name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs SwiftPM plugin code and a stubbed codesign on untrusted pull-request
# branches, so the token gets no more than it needs. Without this the
# repository default applies, which is likely read/write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-scripts:
    runs-on: macos-latest
    # Measured cold runtime is ~23s. This keeps a wide margin over even a slow
    # cold run while cutting how long a hung `swift build` can sit on a runner.
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Signing-mode smoke tests
        run: ./scripts/test-build-signing-mode.sh

      - name: Missing-env fail-closed (import)
        run: |
          if env -u APPLE_DEVELOPER_ID_P12_BASE64 -u APPLE_DEVELOPER_ID_P12_PASSWORD \
            ./scripts/import-signing-certificate.sh; then
            echo "expected import-signing-certificate.sh to fail without secrets" >&2
            exit 1
          fi

      - name: Missing-env fail-closed (notarize)
        run: |
          ./scripts/build-app.sh --version 0.0.0-ci
          if env -u APPLE_API_KEY_ID -u APPLE_API_ISSUER_ID -u APPLE_API_KEY_P8 -u APPLE_TEAM_ID \
            ./scripts/notarize-file.sh dist/WinMice.app; then
            echo "expected notarize-file.sh to fail without secrets" >&2
            exit 1
          fi

      - name: Ad-hoc app rejected by verifier
        run: |
          unset CODESIGN_IDENTITY || true
          ./scripts/build-app.sh --version 0.0.0-ci
          if ./scripts/verify-notarized-app.sh dist/WinMice.app; then
            echo "expected verify-notarized-app.sh to reject ad-hoc app" >&2
            exit 1
          fi

      - name: Sparkle embedding verifier
        run: |
          ./scripts/build-app.sh --version 0.0.0-ci
          ./scripts/verify-sparkle-embedding.sh dist/WinMice.app

      - name: Packaged zip verifier
        run: |
          ./scripts/package-release.sh 0.0.0-ci
          ./scripts/verify-packaged-zip.sh dist/WinMice-0.0.0-ci.zip

      - name: Appcast generator test
        run: ./scripts/test-generate-appcast.sh

      - name: Release version validator test
        run: ./scripts/test-validate-release-version.sh

      - name: Pages home verifier
        run: ./scripts/verify-pages-home.sh

      - name: Graphite theme verifier
        run: ./scripts/verify-graphite-theme.sh

  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Swift tests
        run: swift test

  lint:
    # Both linters are platform-independent and give identical results on
    # Linux, and the Ubuntu runner pool is larger and schedules faster than
    # the macOS one, so there is nothing to gain from running them on macOS.
    runs-on: ubuntu-latest
    # Two ~4MB downloads and two linters that finish in well under a second.
    # The realistic failure here is a stalled download, not slow work.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Both linter steps below are blocking, so both versions are deliberate
      # pins. Left unpinned, an upstream release that adds a new rule fails CI
      # on pull requests that touch no shell script and no workflow at all.
      #
      # To bump: change a version and its sha256 together. actionlint ships an
      # actionlint_<version>_checksums.txt asset, so take that digest from
      # upstream. shellcheck publishes no checksum file for its releases, so
      # its digest here was computed from the downloaded tarball rather than
      # verified against upstream. It is still worth pinning: it makes a
      # silently retagged asset fail this step instead of quietly changing
      # what CI enforces.
      - name: Install pinned linters
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          BIN="${RUNNER_TEMP}/lint-bin"
          mkdir -p "$BIN"

          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/shellcheck.tar.gz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/shellcheck.tar.gz" -C "$BIN" \
            --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "$BIN" actionlint

          chmod +x "$BIN/shellcheck" "$BIN/actionlint"
          "$BIN/shellcheck" --version
          "$BIN/actionlint" --version
          echo "$BIN" >> "$GITHUB_PATH"

      # Most of the release pipeline's logic is POSIX sh. These catch quoting
      # and unset-variable regressions before they reach a release.
      - name: Shellcheck
        run: shellcheck -x -s sh scripts/*.sh

      - name: Actionlint
        run: actionlint
